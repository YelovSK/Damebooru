<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Damebooru Lookup</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --error: #f87171;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, sans-serif;
      padding: 16px;
      min-width: 360px;
      overflow: hidden;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .hint {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(56 189 248 / 0.2);
    }

    button {
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #0f172a;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s;
    }

    button:hover { filter: brightness(1.1); }

    #status {
      height: 16px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      transition: opacity 0.3s;
    }

    #status.error { color: var(--error); }
  </style>
</head>
<body>
  <label for="base-url">Damebooru URL</label>
  <p class="hint">Where "Look up in Damebooru" opens the lookup page.</p>
  <div class="row">
    <input id="base-url" type="url" placeholder="http://localhost:8080" spellcheck="false">
    <button id="save" type="button">Save</button>
  </div>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
