<div class="grid gap-3 sm:grid-cols-2">
  @for (theme of themeOptions; track theme.value) {
    <button
      type="button"
      class="flex flex-col gap-3 rounded-lg border p-4 text-left transition-colors"
      [class.border-accent]="settings().theme === theme.value"
      [class.border-line]="settings().theme !== theme.value"
      [class.hover:border-line-strong]="settings().theme !== theme.value"
      [attr.data-theme]="theme.value"
      (click)="selectTheme(theme.value)">
      <span class="flex h-14 overflow-hidden rounded-md border border-line">
        <span class="flex-1 bg-sunken"></span>
        <span class="flex-1 bg-canvas"></span>
        <span class="flex-1 bg-surface"></span>
        <span class="flex-1 bg-raised"></span>
        <span class="flex-1 bg-accent"></span>
      </span>
      <span class="flex items-center justify-between">
        <span class="font-semibold text-fg">{{ theme.label }}</span>
        @if (settings().theme === theme.value) {
          <span class="text-xs font-semibold uppercase tracking-wide text-accent">Active</span>
        }
      </span>
    </button>
  }
</div>
