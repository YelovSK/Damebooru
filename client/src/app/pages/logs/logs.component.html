<app-page heading="Logs" description="Persisted server logs." width="wide">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
    <app-form-dropdown
      label="Minimum Level"
      [options]="levelOptions"
      [value]="level()"
      (valueChange)="onLevelChange($event)">
    </app-form-dropdown>

    <app-search-input
      label="Category"
      [value]="categoryQuery()"
      [debounceMs]="300"
      placeholder="Category contains..."
      (searchChange)="onCategorySearch($event)">
    </app-search-input>

    <app-search-input
      label="Message/Exception"
      [value]="textQuery()"
      [debounceMs]="300"
      placeholder="Message/exception contains..."
      (searchChange)="onTextSearch($event)">
    </app-search-input>
  </div>

  <div class="bg-surface border border-line rounded-lg p-4">
    <div class="overflow-x-auto">
      <table class="min-w-[760px] w-full text-left text-fg text-sm">
        <thead>
          <tr class="border-b border-line">
            <th class="py-2 pr-3">Time</th>
            <th class="py-2 pr-3">Level</th>
            <th class="py-2 pr-3">Category</th>
            <th class="py-2">Message</th>
          </tr>
        </thead>
        <tbody>
          @for (entry of logs(); track entry.id) {
            <tr class="border-b border-line align-top">
              <td class="py-2 pr-3 whitespace-nowrap">{{ entry.timestampUtc | dateTime: 'full' }}</td>
              <td class="py-2 pr-3">
                <span class="inline-flex rounded border px-2 py-0.5 text-xs font-semibold uppercase tracking-wide"
                  [ngClass]="getLevelClass(entry.level)">
                  {{ entry.level }}
                </span>
              </td>
              <td class="py-2 pr-3 break-all">{{ entry.category }}</td>
              <td class="py-2">
                <div>{{ entry.message }}</div>
                @if (entry.exception) {
                  <pre class="mt-2 whitespace-pre-wrap rounded border border-line bg-sunken p-2 text-xs text-danger">{{ entry.exception }}</pre>
                }
                @if (entry.propertiesJson) {
                  <pre class="mt-2 whitespace-pre-wrap rounded border border-line bg-sunken p-2 text-xs text-fg-muted">{{ entry.propertiesJson }}</pre>
                }
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="mt-4 flex justify-center">
      <button appButton type="button" variant="secondary" size="sm" (click)="loadMore()" [disabled]="!hasMore()">Load older logs</button>
    </div>
  </div>
</app-page>
