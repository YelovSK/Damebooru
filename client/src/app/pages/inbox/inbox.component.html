<div class="p-3 flex flex-col flex-1 min-h-0">
    <div class="mb-4 flex items-baseline gap-3">
        <h1 class="text-3xl font-bold text-fg">Inbox</h1>
        <span class="text-fg-muted">{{ store.totalCount() | number }} unsorted</span>
    </div>

    <app-tabs route>
        <app-tab id="review" label="Review">
            <app-inbox-review />
        </app-tab>
        <app-tab id="bulk" label="Bulk">
            <app-inbox-bulk />
        </app-tab>
    </app-tabs>
</div>
