<div class="flex justify-center items-center min-h-screen bg-canvas font-sans">
    <div class="card p-12 w-full max-w-[600px]">
        <header class="text-center mb-10">
            <h1 class="text-[2.5rem] font-extrabold mb-2 text-accent">Damebooru</h1>
            <p class="text-fg-muted text-base">Login to your account</p>
        </header>

        <form (ngSubmit)="onLogin()">
            <div class="mb-6">
                <label for="username" appFieldLabel>Username</label>
                <input type="text" id="username" [(ngModel)]="username" name="username"
                    placeholder="Enter your username" required
                    appInput />
            </div>

            <div class="mb-6">
                <label for="password" appFieldLabel>Password</label>
                <input type="password" id="password" [(ngModel)]="password" name="password"
                    placeholder="Enter your password" required
                    appInput />
            </div>

            @if (error()) {
            <div class="text-danger bg-danger/10 p-3 rounded-sm mb-6 text-[0.85rem] border border-danger/20">
                {{ error() }}
            </div>
            }

            <button appButton type="submit" [disabled]="loading()" variant="primary" [fullWidth]="true">
                {{ loading() ? 'Logging in...' : 'Login' }}
            </button>
        </form>
    </div>
</div>
