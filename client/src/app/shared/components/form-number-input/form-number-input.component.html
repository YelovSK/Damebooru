<div class="w-full">
  @if (label()) {
    <label
      [for]="id()"
      class="inline-block text-[0.85rem] font-medium text-fg-muted mb-1.5 ml-1"
    >
      {{ label() }}
    </label>
  }

  <div class="relative">
    <input
      [id]="id()"
      type="number"
      [placeholder]="placeholder()"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [ngModel]="displayValue"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
      [disabled]="disabled"
      class="w-full px-4 py-2.5 pr-12 bg-surface border rounded-xl text-fg text-[0.9rem] outline-none transition-all focus:bg-raised focus: disabled:opacity-50 disabled:cursor-not-allowed placeholder:text-fg-subtle [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:m-0 [&::-webkit-inner-spin-button]:m-0"
      [class.border-line]="!hasError()"
      [class.border-danger]="hasError()"
      [class.focus:border-accent]="!hasError()"
      [class.focus:border-danger]="hasError()"
    />

    <div class="absolute right-1.5 top-1.5 bottom-1.5 w-7 overflow-hidden rounded-md border border-line bg-surface/70 grid grid-rows-2">
      <button
        type="button"
        [disabled]="disabled"
        (click)="stepBy(1)"
        class="appearance-none m-0 p-0 w-full h-full flex items-center justify-center border-b border-line text-fg-muted transition-colors hover:bg-raised hover:text-fg disabled:cursor-not-allowed disabled:opacity-40 leading-none"
        [attr.aria-label]="'Increase ' + (label() || 'value')"
      >
        <svg viewBox="0 0 24 24" class="h-3 w-3" aria-hidden="true">
          <path d="M7 14l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button
        type="button"
        [disabled]="disabled"
        (click)="stepBy(-1)"
        class="appearance-none m-0 p-0 w-full h-full flex items-center justify-center text-fg-muted transition-colors hover:bg-raised hover:text-fg disabled:cursor-not-allowed disabled:opacity-40 leading-none"
        [attr.aria-label]="'Decrease ' + (label() || 'value')"
      >
        <svg viewBox="0 0 24 24" class="h-3 w-3" aria-hidden="true">
          <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </div>

  <app-form-errors [control]="ngControl" [label]="label()"></app-form-errors>
</div>
