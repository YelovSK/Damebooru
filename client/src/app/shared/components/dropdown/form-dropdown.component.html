<div class="relative w-full min-w-0">
  @if (label()) {
    <div class="mb-1.5 ml-1 text-[0.85rem] font-medium text-fg-muted">{{ label() }}</div>
  }

  <button
    type="button"
    (click)="toggle()"
    class="group flex w-full min-w-0 items-center justify-between rounded-xl border border-line bg-surface px-4 py-2.5 text-left transition-all hover:bg-raised disabled:cursor-not-allowed disabled:opacity-60"
    [disabled]="isDisabled()"
    [class.border-accent]="isOpen()"
    [class.]="isOpen()">
    <span class="min-w-0 truncate text-[0.9rem] font-medium text-fg">
      {{ selectedOption()?.label || placeholder() }}
    </span>

    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="shrink-0 text-fg-muted transition-transform duration-200 group-hover:text-fg"
      [class.rotate-180]="isOpen()">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  @if (isOpen()) {
    <ul class="box-scrollbar absolute left-0 right-0 top-[calc(100%+8px)] z-[1000] m-0 max-h-[300px] list-none overflow-y-auto rounded-xl border border-line bg-surface p-2">
      @for (option of options(); track $index) {
        <li
          tabindex="0"
          role="option"
          [attr.aria-selected]="option.value === selectedOption()?.value"
          [attr.aria-disabled]="option.disabled === true"
          (click)="select(option)"
          (keydown)="onOptionKeydown($event, option)"
          class="mb-0.5 truncate rounded-lg px-4 py-2.5 text-[0.85rem] font-medium text-fg transition-colors duration-150 last:mb-0 focus:outline-none"
          [class.cursor-pointer]="!option.disabled"
          [class.cursor-not-allowed]="option.disabled"
          [class.opacity-40]="option.disabled"
          [class.hover:bg-raised]="!option.disabled"
          [class.hover:text-fg]="!option.disabled"
          [class.focus:bg-raised]="!option.disabled"
          [class.focus:text-fg]="!option.disabled"
          [class.bg-accent/10]="option.value === selectedOption()?.value"
          [class.text-accent]="option.value === selectedOption()?.value">
          {{ option.label }}
        </li>
      }
    </ul>
  }
</div>
