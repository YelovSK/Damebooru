<div class="relative w-full min-w-0">
  @if (label()) {
    <div appFieldLabel>{{ label() }}</div>
  }

  <button
    type="button"
    (click)="toggle()"
    appInput class="group flex cursor-pointer items-center justify-between gap-2 text-left"
    [disabled]="isDisabled()"
    [class.border-accent]="isOpen()">
    <span class="min-w-0 truncate">
      {{ selectedOption()?.label || placeholder() }}
    </span>

    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="shrink-0 text-fg-muted transition-transform duration-200 group-hover:text-fg"
      [class.rotate-180]="isOpen()">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  @if (isOpen()) {
    <ul class="box-scrollbar absolute left-0 right-0 top-[calc(100%+8px)] z-[1000] m-0 max-h-[300px] list-none overflow-y-auto rounded-lg border border-line-strong bg-surface p-1.5">
      @for (option of options(); track $index) {
        <li
          tabindex="0"
          role="option"
          [attr.aria-selected]="option.value === selectedOption()?.value"
          [attr.aria-disabled]="option.disabled === true"
          (click)="select(option)"
          (keydown)="onOptionKeydown($event, option)"
          class="mb-0.5 truncate rounded-md px-2.5 py-1.5 text-sm text-fg transition-colors duration-150 last:mb-0 focus:outline-none"
          [class.cursor-pointer]="!option.disabled"
          [class.cursor-not-allowed]="option.disabled"
          [class.opacity-40]="option.disabled"
          [class.hover:bg-raised]="!option.disabled"
          [class.hover:text-fg]="!option.disabled"
          [class.focus:bg-raised]="!option.disabled"
          [class.focus:text-fg]="!option.disabled"
          [class.bg-accent/10]="option.value === selectedOption()?.value"
          [class.text-accent]="option.value === selectedOption()?.value">
          {{ option.label }}
        </li>
      }
    </ul>
  }
</div>
