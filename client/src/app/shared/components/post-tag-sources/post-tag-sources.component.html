<div class="flex items-center gap-1.5 text-fg-muted">
  @for (icon of icons(); track icon.source) {
    <span class="inline-flex h-3.5 w-3.5" [appTooltip]="icon.label" tooltipPosition="right">
      <svg class="h-3.5 w-3.5" [attr.viewBox]="icon.viewBox" role="img" [attr.aria-label]="icon.label"
        fill="none" stroke="currentColor"
        [attr.stroke-width]="icon.strokeWidth ?? 2"
        stroke-linecap="round" stroke-linejoin="round">
        @for (path of icon.paths; track path) {
          <path [attr.d]="path" />
        }
      </svg>
    </span>
  }
</div>
