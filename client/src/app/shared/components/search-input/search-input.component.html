<div class="relative w-full">
  @if (label()) {
    <label [for]="inputId" appFieldLabel>{{ label() }}</label>
  }

  <input
    [id]="inputId"
    type="text"
    [value]="query()"
    (input)="onInput($event)"
    [placeholder]="placeholder()"
    appInput class="!pr-9" />

  @if (query()) {
    <button
      type="button"
      (click)="clear()"
      class="absolute right-2 top-1/2 -translate-y-1/2 rounded px-1 text-sm text-fg-muted hover:text-fg">
      ×
    </button>
  }
</div>
