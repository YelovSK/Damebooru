<div #container class="w-full h-full overflow-hidden flex items-center justify-center"
    [class.touch-none]="touchEnabled()"
    [style.cursor]="isDragging() ? 'grabbing' : 'grab'">
    <div #content class="w-full h-full flex items-center justify-center will-change-transform">
        <ng-content />
    </div>
</div>
