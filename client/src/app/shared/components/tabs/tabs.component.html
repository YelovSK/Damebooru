<div #tabList class="relative mb-6 flex shrink-0 gap-1 overflow-x-auto border-b border-line" role="tablist">
  <div
    class="pointer-events-none absolute bottom-0 left-0 z-0 h-0.5 rounded-full bg-accent transition-[transform,width,opacity] duration-200 ease-out"
    [class.opacity-0]="!indicatorVisible()"
    [style.transform]="indicatorTransform()"
    [style.width.px]="indicatorWidth()">
  </div>

  @for (tab of visibleTabs(); track tab.id()) {
    @if (route()) {
      <a
        #tabControl
        role="tab"
        [routerLink]="[basePath(), tab.id()]"
        [replaceUrl]="true"
        routerLinkActive="!text-fg !font-semibold"
        class="relative z-10 flex h-11 flex-none cursor-pointer items-center justify-center gap-2 whitespace-nowrap border-0 bg-transparent px-3 text-center text-[0.9375rem] font-medium text-fg-muted no-underline transition-colors hover:text-fg"
        [attr.aria-selected]="tab === activeTab()">
        @if (tab.icon()) {
          <i [class]="tab.icon()"></i>
        }
        {{ tab.label() }}
      </a>
    } @else {
      <button
        #tabControl
        type="button"
        role="tab"
        class="relative z-10 flex h-11 flex-none cursor-pointer items-center justify-center gap-2 whitespace-nowrap border-0 bg-transparent px-3 text-center text-[0.9375rem] font-medium text-fg-muted transition-colors hover:text-fg"
        [class.!text-fg]="tab === activeTab()"
        [class.!font-semibold]="tab === activeTab()"
        [attr.aria-selected]="tab === activeTab()"
        (click)="selectTab(tab.id())">
        @if (tab.icon()) {
          <i [class]="tab.icon()"></i>
        }
        {{ tab.label() }}
      </button>
    }
  }
</div>

@if (activeTab(); as tab) {
  @if (tab.content(); as template) {
    <ng-container *ngTemplateOutlet="template"></ng-container>
  }
}
