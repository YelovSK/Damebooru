<div class="w-full">
  @if (label()) {
    <label
      [for]="id()"
      appFieldLabel
    >
      {{ label() }}
    </label>
  }

  <input
    [id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [ngModel]="value"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
    [disabled]="disabled"
    appInput
    [invalid]="hasError()"
  />

  <app-form-errors [control]="ngControl" [label]="label()"></app-form-errors>
</div>
