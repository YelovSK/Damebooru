<div class="w-full">
  @if (label()) {
    <label
      [for]="id()"
      class="inline-block text-[0.85rem] font-medium text-fg-muted mb-1.5 ml-1"
    >
      {{ label() }}
    </label>
  }

  <input
    [id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [ngModel]="value"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
    [disabled]="disabled"
    class="w-full px-4 py-2.5 bg-surface border rounded-xl text-fg text-[0.9rem] outline-none transition-all focus:bg-raised focus: disabled:opacity-50 disabled:cursor-not-allowed placeholder:text-fg-subtle"
    [class.border-line]="!hasError()"
    [class.border-danger]="hasError()"
    [class.focus:border-accent]="!hasError()"
    [class.focus:border-danger]="hasError()"
  />

  <app-form-errors [control]="ngControl" [label]="label()"></app-form-errors>
</div>
