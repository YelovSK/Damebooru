<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tagging</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f7;
    --panel: #ffffff;
    --text: #1d1d20;
    --muted: #6b6b75;
    --border: #dcdce0;
    --accent: #4f6bed;
    --bar: #4f6bed33;
    --error: #d33c3c;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141417;
    --panel: #1d1d22;
    --text: #e6e6ea;
    --muted: #8d8d98;
    --border: #2f2f37;
    --accent: #7b91ff;
    --bar: #7b91ff33;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  select, input[type="number"] {
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
  }
  input[type="number"] { width: 9em; }
  button, .file-button {
    font: inherit;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .file-button input { display: none; }
  main {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
  }
  #drop {
    display: grid;
    place-items: center;
    min-height: 240px;
    border: 2px dashed var(--border);
    border-radius: 10px;
    color: var(--muted);
    text-align: center;
    padding: 16px;
  }
  body.dragging #drop { border-color: var(--accent); color: var(--accent); }
  #preview { max-width: 100%; max-height: 50vh; border-radius: 6px; }
  .toolbar {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  #status { color: var(--muted); }
  #status.error { color: var(--error); }
  #results {
    max-height: 60vh;
    overflow-y: auto;
    padding: 0 12px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  #results:empty { display: none; }
  h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 16px 0 6px;
  }
  .tag {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 3px 8px;
    border-radius: 4px;
    background: linear-gradient(to right, var(--bar) var(--score), transparent var(--score));
  }
  .tag.below { opacity: 0.45; }
  .tag span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>AI Tagging</h1>
  <label>Model <select id="model"></select></label>
  <label>Threshold <input id="threshold" type="number" min="0" max="1" step="0.01" placeholder="model default"></label>
  <label><input id="show-below" type="checkbox"> Show below threshold</label>
  <label><input id="underscores" type="checkbox"> Replace underscores</label>
  <label><input id="dark" type="checkbox"> Dark mode</label>
  <label class="file-button">Choose image<input id="file" type="file" accept="image/*"></label>
</header>
<main>
  <div id="drop">
    <span id="hint">Drop, paste or choose an image</span>
    <img id="preview" alt="" hidden>
  </div>
  <section>
    <div class="toolbar">
      <div id="status"></div>
      <button id="copy" hidden>Copy tags</button>
    </div>
    <div id="results"></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const modelSelect = $("model");
  const thresholdInput = $("threshold");
  const showBelowInput = $("show-below");
  const underscoresInput = $("underscores");
  const status = $("status");
  const results = $("results");

  let models = {};
  let currentFile = null;
  let response = null;
  let requestId = 0;

  function setStatus(text, isError = false) {
    status.textContent = text;
    status.classList.toggle("error", isError);
  }

  async function loadModels() {
    const res = await fetch("models");
    const data = await res.json();
    models = Object.fromEntries(data.models.map((m) => [m.id, m]));
    for (const m of data.models) {
      modelSelect.add(new Option(m.id, m.id, false, m.id === data.default_model));
    }
  }

  function thresholdFor(category) {
    if (thresholdInput.value !== "") return Number(thresholdInput.value);
    const model = models[response.model];
    return model.category_thresholds[category] ?? model.default_threshold;
  }

  function tagName(tag) {
    return underscoresInput.checked ? tag.name.replaceAll("_", " ") : tag.name;
  }

  function visibleTags() {
    return Object.entries(response.tags_by_category).map(([category, tags]) => {
      const threshold = thresholdFor(category);
      const rows = tags
        .map((tag) => ({ ...tag, below: tag.score < threshold }))
        .filter((tag) => showBelowInput.checked || !tag.below);
      return [category, threshold, rows];
    });
  }

  function render() {
    results.replaceChildren();
    $("copy").hidden = !response;
    if (!response) return;

    for (const [category, threshold, tags] of visibleTags()) {
      if (!tags.length) continue;
      const heading = document.createElement("h2");
      heading.textContent = `${category} (${tags.filter((t) => !t.below).length}) · ≥ ${threshold}`;
      results.append(heading);
      for (const tag of tags) {
        const row = document.createElement("div");
        row.className = tag.below ? "tag below" : "tag";
        row.style.setProperty("--score", `${tag.score * 100}%`);
        const name = document.createElement("span");
        name.textContent = tagName(tag);
        const score = document.createElement("span");
        score.textContent = tag.score.toFixed(3);
        row.append(name, score);
        results.append(row);
      }
    }
  }

  async function tag() {
    if (!currentFile) return;
    const id = ++requestId;
    const form = new FormData();
    form.append("file", currentFile);
    form.append("model", modelSelect.value);
    form.append("include_below_threshold", "true");
    setStatus(`Tagging with ${modelSelect.value}…`);

    try {
      const res = await fetch("tag", { method: "POST", body: form });
      const data = await res.json();
      if (id !== requestId) return;
      if (!res.ok) throw new Error(data.detail ?? res.statusText);
      response = data;
      setStatus(`${data.model} · ${data.provider} · ${data.elapsed_ms} ms`);
    } catch (ex) {
      if (id !== requestId) return;
      response = null;
      setStatus(String(ex.message ?? ex), true);
    }
    render();
  }

  function setFile(file) {
    if (!file || !file.type.startsWith("image/")) return;
    currentFile = file;
    const preview = $("preview");
    URL.revokeObjectURL(preview.src);
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    $("hint").hidden = true;
    tag();
  }

  $("file").addEventListener("change", (e) => setFile(e.target.files[0]));
  modelSelect.addEventListener("change", tag);
  for (const input of [thresholdInput, showBelowInput, underscoresInput]) {
    input.addEventListener("input", render);
  }

  window.addEventListener("dragover", (e) => {
    e.preventDefault();
    document.body.classList.add("dragging");
  });
  window.addEventListener("dragleave", (e) => {
    if (!e.relatedTarget) document.body.classList.remove("dragging");
  });
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    document.body.classList.remove("dragging");
    setFile(e.dataTransfer.files[0]);
  });
  window.addEventListener("paste", (e) => {
    setFile([...e.clipboardData.files].find((f) => f.type.startsWith("image/")));
  });

  $("copy").addEventListener("click", () => {
    const names = visibleTags().flatMap(([, , tags]) => tags.filter((t) => !t.below).map(tagName));
    navigator.clipboard.writeText(names.join(underscoresInput.checked ? ", " : " "));
  });

  const darkInput = $("dark");
  function applyTheme(dark) {
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    darkInput.checked = dark;
  }
  let savedTheme = null;
  try { savedTheme = localStorage.getItem("theme"); } catch {}
  applyTheme(savedTheme ? savedTheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
  darkInput.addEventListener("change", () => {
    applyTheme(darkInput.checked);
    try { localStorage.setItem("theme", document.documentElement.dataset.theme); } catch {}
  });

  loadModels().catch((ex) => setStatus(`Failed to load models: ${ex.message}`, true));
</script>
</body>
</html>
